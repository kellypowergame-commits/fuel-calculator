<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出差油資計算機</title>

<style>
body {
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  max-width: 500px;
  margin: 0 auto;
  padding: 20px;
  background: #f5f5f5;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 5px;
}

input, select {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  font-size: 16px;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #eee;
  border-radius: 8px;
}

.warning {
  margin-top: 12px;
  font-weight: bold;
}

textarea {
  width: 100%;
  height: 100px;
  margin-top: 10px;
  font-size: 15px;
  padding: 10px;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div class="card">

<h2>出差油資計算機</h2>

<label>單程公里數</label>
<input type="number" id="km" value="0">

<label>行程</label>
<select id="trip">
  <option value="2">來回</option>
  <option value="1">單程</option>
</select>

<label>住宿日數</label>
<input type="number" id="stay" value="0">

<label>單程 ETC</label>
<input type="number" id="etc" value="0">

<label>趟數</label>
<input type="number" id="times" value="1">

<button onclick="calculate()">計算</button>

<div class="result">
  <div>總金額：</div>
  <h2 id="total">0 元</h2>

  <div id="warning" class="warning"></div>

  <label>備註</label>
  <textarea id="note" readonly></textarea>

  <button onclick="copyNote()">複製備註</button>
</div>

</div>

<script>
function calculate() {
  const km = Number(document.getElementById("km").value);
  const trip = Number(document.getElementById("trip").value);
  const stay = Number(document.getElementById("stay").value);
  const etc = Number(document.getElementById("etc").value);
  const times = Number(document.getElementById("times").value);

  const total = ((km * trip * (3.5 + stay)) + (etc * trip)) * times;

  document.getElementById("total").innerText =
    total.toLocaleString() + " 元";

  let warning = "";

  if (trip === 1 && stay > 0) {
    warning = "⚠ 單程＋住宿，住宿算法可能需另外確認";
  }

  document.getElementById("warning").innerText = warning;

  const tripText = trip === 2 ? "來回" : "單程";

  const note =
    km + "公里｜" +
    tripText +
    "｜住宿" + stay + "日｜ETC " + etc + "元｜[" +
    km + "×" + trip + "×(3.5+" + stay + ")+" +
    etc + "×" + trip + "]×" +
    times + "趟＝" +
    total + "元";

  document.getElementById("note").value = note;
}

function copyNote() {
  const text = document.getElementById("note");

  text.select();
  text.setSelectionRange(0, 99999);

  navigator.clipboard.writeText(text.value);

  alert("備註已複製");
}
</script>

</body>
</html>
